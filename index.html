<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong Mom - Personal program</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F7B7B">
<meta name="apple-mobile-web-app-title" content="Strong Mom">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&display=swap">
<style>
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --ink:#1C221F; --ink-2:#5B645F; --line:#D9DED9;
  --accent:#1E4FD8; --accent-ink:#FFFFFF; --soft:#E6ECFB; --warn:#B4531A; --ok:#1F7A4D; --ok-soft:#DFF2E6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181B1A; --surface:#222624; --ink:#EEF1EE; --ink-2:#A2ABA6; --line:#343A37;
    --accent:#7C9BFF; --accent-ink:#0F1730; --soft:#26304A; --warn:#F0955C; --ok:#5FCB8E; --ok-soft:#1E3A2B;
  }
}
:root[data-theme="dark"]{
  --bg:#181B1A; --surface:#222624; --ink:#EEF1EE; --ink-2:#A2ABA6; --line:#343A37;
  --accent:#7C9BFF; --accent-ink:#0F1730; --soft:#26304A; --warn:#F0955C; --ok:#5FCB8E; --ok-soft:#1E3A2B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:clip;}
body{overflow-x:clip;max-width:100vw}
main{min-width:0}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 24px}
h1,h2,h3{margin:0;font-weight:800;line-height:1.05}
.display{font-variation-settings:"wdth" 70;font-weight:900;letter-spacing:-.01em}
.mark{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:6px}
.mark .kg{font-variation-settings:"wdth" 70;font-weight:900;font-size:34px;line-height:1;color:var(--accent)}
.mark .app{font-size:14px;color:var(--ink-2)}
.meta{color:var(--ink-2);font-size:14px}
.session-title{font-size:44px;margin:14px 0 4px}
@media (min-width:480px){.session-title{font-size:56px}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.done::after{content:" ✓";color:var(--ok)}
.chip[aria-pressed="true"].done::after{color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h3{font-size:18px;margin-bottom:8px}
.pill{display:inline-block;background:var(--soft);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}
.pill.warn{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .chk{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;margin-top:2px}
.ex.on .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.ex .name{font-weight:700}
.ex .rx{font-size:15px}
.ex .cue{font-size:13px;color:var(--ink-2);margin-top:2px}
.ex.on .name{text-decoration:line-through;color:var(--ink-2)}
.rest{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;padding:4px 8px;border:1px solid var(--accent);border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:12px 18px;min-height:46px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
.timer{font-variation-settings:"wdth" 70;font-weight:900;font-size:min(72px,18vw);line-height:1;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.timer.small{font-size:40px}
.roundsbig{font-variation-settings:"wdth" 70;font-weight:900;font-size:32px;line-height:1}
ol.plain{margin:6px 0 0;padding-left:20px}
ol.plain li{margin:4px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:4px 0}
.note{font-size:14px;color:var(--ink-2)}
.warnbox{border-left:4px solid var(--warn);padding:10px 12px;background:var(--surface);border-radius:0 10px 10px 0;margin:12px 0;font-size:15px}
.grid12{display:grid;grid-template-columns:auto repeat(6,minmax(0,1fr));gap:4px;align-items:center;font-size:12px}
.grid12 .cell{height:30px;min-width:0;border-radius:5px;background:var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;line-height:1}
.grid12 .cell .up{color:#fff}.grid12 .cell .dn{color:#FFE4D1}.grid12 .cell .eq{opacity:.8}
.grid12 .cell.on{background:var(--ok)}
.grid12 .cell.opt:not(.on){background:transparent;border:1px dashed var(--line)}
.grid12 .cell.cur{outline:2px solid var(--accent);outline-offset:-2px}
.grid12 .wk{color:var(--ink-2);padding-right:6px;text-align:right}
.grid12 .hd{color:var(--ink-2);text-align:center}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kpi b{display:block;font-variation-settings:"wdth" 70;font-weight:900;font-size:26px;line-height:1;overflow-wrap:anywhere}
.kpi span{font-size:13px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line)}
th{color:var(--ink-2);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.field{display:grid;gap:4px;font-size:14px}
.field span{color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
svg.chart{width:100%;height:120px;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 4px;border-radius:10px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restbar.show{display:flex}
.restbar b{font-variation-settings:"wdth" 70;font-weight:900;font-size:32px;font-variant-numeric:tabular-nums;line-height:1}
.restbar button{color:var(--bg);border:1px solid var(--bg);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7}
.toast.show{opacity:1}
details summary{cursor:pointer;font-weight:700}
.phaseline{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:8px 0}
.phaseline i{height:8px;border-radius:2px;background:var(--line);display:block}
.phaseline i.p0{background:var(--accent);opacity:.45}.phaseline i.p1{background:var(--accent);opacity:.7}.phaseline i.p2{background:var(--accent)}
.phaseline i.cur{outline:2px solid var(--ink);outline-offset:1px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.ex{grid-template-columns:28px 1fr auto}
.ex .thumb{width:100%;max-width:150px;height:auto;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0 4px;cursor:zoom-in}
.ex .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.link{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:4px 8px;display:inline-block}
.upl{font-size:13px;font-weight:700;color:var(--ink-2);border:1px dashed var(--line);border-radius:8px;padding:4px 8px;display:inline-block;cursor:pointer}
.upl input{display:none}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lib .item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start}
.lib .item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.lib .item .ph{width:100%;height:120px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink-2);font-size:12px;text-align:center;padding:8px}
.lib .item b{font-size:14px;line-height:1.2}
.guided{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px;margin:14px 0;text-align:center}
.guided .count{font-variation-settings:"wdth" 70;font-weight:900;font-size:64px;line-height:1;color:var(--accent)}
.guided .lbl{font-size:13px;color:var(--ink-2)}
.guided .exname{font-variation-settings:"wdth" 75;font-weight:900;font-size:34px;line-height:1.05;margin:10px 0 6px}
.guided .rx{font-size:18px;font-weight:700}
.guided .cue{font-size:15px;color:var(--ink-2);margin:6px auto 0;max-width:36ch}
.guided .thumb{max-width:220px;margin:12px auto 0}
.gvid{display:block;width:100%;max-width:360px;aspect-ratio:9/12;max-height:46vh;object-fit:cover;border-radius:14px;margin:12px auto 0;background:#000}
.guided .next .gvid{max-width:260px;max-height:34vh}
.guided .next{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;text-align:left}
.guided .next .exname{font-size:26px}
.guided .btns{display:grid;gap:10px;margin-top:18px}
.guided .btn{width:100%}
.guided.rest .count{color:var(--ink)}
.progressline{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progressline i{display:block;height:100%;background:var(--accent);transition:width .3s}
.loadf{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);margin-top:6px}
.loadf input{width:84px;padding:6px 8px;font-size:14px}
.itemrow{display:flex;gap:10px;align-items:flex-start}
.itemrow .mini{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:0 0 auto;cursor:zoom-in}
.itemrow .cue{font-size:13px;color:var(--ink-2)}
.focus{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:15;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.focus.show{display:flex}
.focus .ftimer{font-variation-settings:"wdth" 70;font-weight:900;font-size:min(96px,22vw);line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.focus .ftimer.paused{opacity:.5}
.focus .ftimer.over,.timer.over{color:var(--warn)}
.focus .frounds{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.focus .frounds b{font-variation-settings:"wdth" 70;font-weight:900;font-size:44px;line-height:1}
.focus ol{margin:8px 0 0;padding-left:20px}
.focus ol li{margin:8px 0}
.focus .fbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:12px}
.focus .big{grid-column:1/-1;font-size:20px;min-height:60px}
.prep{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:end center;z-index:18;padding:16px}
.prep.show{display:grid}
.prep .box{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px}
.prep .kicker{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.prep h3{font-variation-settings:"wdth" 75;font-weight:900;font-size:30px;line-height:1.05;margin-bottom:12px}
.prep .line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.prep .line b{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding-top:3px}
.prep .btns{display:grid;gap:8px;margin-top:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:20;padding:20px}
.overlay.show{display:grid}
.overlay img{max-width:100%;max-height:80vh;border-radius:12px}
.overlay .cap{color:#fff;font-weight:700;margin-top:10px;text-align:center}
.overlay .row{margin-top:12px;justify-content:center}
.overlay button{color:#fff;border:1px solid #fff;border-radius:8px;padding:8px 14px;font-weight:700}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<main id="app"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="program"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Program</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/></svg>Progress</button>
  <button data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M17 3c-2 1-3 4-3 7v11"/></svg>Nutrition</button>
</nav>

<div class="restbar" id="restbar" role="status" aria-live="polite">
  <div><div style="font-size:12px;opacity:.8">Rest</div><b id="restnum">0:00</b></div>
  <div class="row"><button id="restplus">+30 s</button><button id="reststop">Stop</button></div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="prep" id="prep" role="dialog" aria-modal="true"><div class="box"><div class="kicker" id="prepKick"></div><h3 id="prepTitle"></h3><div id="prepLines"></div><div class="btns"><button class="btn" id="prepGo">Let's go</button><button class="btn ghost small" id="prepCancel">Not now</button></div></div></div>
<div class="focus" id="focus" role="dialog" aria-modal="true"><div class="lbl meta" id="fTitle"></div><div class="ftimer" id="fTimer">0:00</div><div class="frounds"><div><div class="meta">Rounds</div><b id="fRounds">0</b></div><div class="row"><button class="btn ghost small" id="fMinus" aria-label="Remove a round">−1</button><button class="btn" id="fPlus">+1 round</button></div></div><ol id="fList"></ol><div class="fbtns"><button class="btn ghost" id="fPause">Pause</button><button class="btn ghost" id="fQuit">Finish</button></div></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div><img id="ovImg" alt=""><video id="ovVid" style="display:none;max-width:100%;max-height:70vh;border-radius:12px" controls loop muted playsinline></video><div class="cap" id="ovCap"></div><div class="row"><button id="ovDel">Delete image</button><button id="ovClose">Close</button></div></div></div>

<script>
/* ===================== Programme ===================== */
const PHASES = [
  {name:'Foundations', weeks:'Weeks 1–4', goal:'Relearn the movements gently, feel your glutes working, find your rhythm. Light loads, perfect technique.'},
  {name:'Building', weeks:'Weeks 5–8', goal:'More volume and load on glutes and hamstrings, upper body progressing. This is where the shape changes.'},
  {name:'Sculpting', weeks:'Weeks 9–12', goal:'Heavier loads, single-leg work, longer circuits. Firm, balanced, athletic.'}
];
const WARMUP = ['2 min marching in place or step jacks (no jumping)','10 hip circles each side, 10 shoulder circles','15 glute bridges on the floor, 1 s squeeze at the top','10 bodyweight squats, slow on the way down','10 hip hinges, hands on hips','10 kettlebell halos each direction'];
const LIB = [
 ['goblet','Goblet squat'],['hipthrustkb','Floor hip thrust with KB'],['fente','Goblet reverse lunge'],['abduction','Side-lying hip abduction'],['pont1','Single-leg glute bridge'],['planche','Plank'],
 ['pompesg','Push-ups (knees → incline → full)'],['row2','Two-hand bent-over row'],['press2','Two-hand KB press'],['row1','One-arm row (gorilla row)'],['halo','Kettlebell halo'],['deadbug','Dead bug'],['birddog','Bird dog'],
 ['rdlkb','KB Romanian deadlift'],['swing2','Two-hand swing'],['pontsur','Feet-elevated glute bridge'],['stepup','Step-up on a stair'],['kickback','Quadruped glute kickback'],['suitcase','Suitcase carry'],
 ['sldl','Single-leg deadlift'],['burpee','No-jump burpee'],['mollets','Calf raises'],['mobilite','Hip mobility: 90/90, pigeon, couch stretch'],
 ['legpress','Leg press'],['hipthrustbar','Barbell hip thrust'],['walkinglunge','Dumbbell walking lunges'],['abdmachine','Hip abduction machine'],['hipthrust1g','Single-leg hip thrust on a bench'],['dbbench','Dumbbell bench press'],['cablerow','Seated cable row'],['dbohp','Dumbbell shoulder press'],['latpull','Lat pulldown'],['rdl','Barbell Romanian deadlift'],['kbswing16','16 kg KB swing'],['goodmorning','45° back extension'],['stepupdb','Dumbbell step-up on a bench'],['cablekick','Cable kickback'],['farmerdb','Dumbbell farmer walk'],['rower','Rowing machine'],['bulgare','Dumbbell Bulgarian split squat'],['legcurl','Lying leg curl']
];
const LIBMAP = Object.fromEntries(LIB);
const CUES = {goblet:'KB against your chest, elbows inside your knees, heels down, go as low as feels comfortable.', swing2:'Drive with the hips, arms relaxed, squeeze the glutes at the top.', pompesg:'Straight line from knees (or feet) to head, chest toward the floor.', hipthrustkb:'Back on the floor, KB resting on your hips, push through the heels and squeeze 1 s at the top.', row2:'Torso at 45°, flat back, pull the KB toward your belly button.', rdlkb:'Hips back, flat back, KB slides down your legs until you feel the hamstrings.', fente:'Step back, front knee over the ankle, torso upright.', kickback:'On all fours, push the heel toward the ceiling without arching.', burpee:'Down into a push-up, back to a squat, stand up without jumping.', suitcase:'KB on one side, shoulders down, walk tall without leaning.', halo:'Hold the KB by the horns, circle it around your head, elbows close to your ears.', rower:'Legs, then back, then arms. Return in reverse order.', kbswing16:'Same swing, heavier bell: hips, not arms.', farmerdb:'One dumbbell each side, shoulders down, walk tall.', press2:'KB by the horns at your chest, press overhead, glutes tight.'};
function itemHtml(txt,k){ const s=k?imgSrc(k):null; return `<li><div class="itemrow">${s?`<img class="mini" src="${s}" alt="" data-view="${k}">`:''}<div><div>${esc(txt)}</div>${k&&CUES[k]?`<div class="cue">${esc(CUES[k])}</div>`:''}</div></div></li>`; }
const DAYS = [
 {id:'lun', name:'Monday', title:'Glutes & legs', kind:'sets', rest:75, placeDefault:'gym',
  intro:'Daycare day, gym day. Your signature session: hip thrusts and squats with real weight. Rest 60 to 75 s. Feel the glutes on every rep.',
  blocks:[

/* ===================== État ===================== */
const KEY = 'solide-state-v1';
let state = {start:null, weight:62, checks:{}, sessions:[], tests:[], amrapRounds:{}, images:{}, place:'home', loads:{}, cycle:1, express:false, videos:{}};
let localImgs = {}; try{ localImgs = JSON.parse(localStorage.getItem('solide-imgs')||'{}'); }catch(e){}
let assetsNs = null;
let repoImgs = {}; let repoVids = {};
try{ fetch('videos/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&typeof j==='object'){ repoVids=j; render(); } }).catch(()=>{}); }catch(e){}
try{ fetch('images/index.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&typeof j==='object'){ repoImgs=j; render(); } }).catch(()=>{}); }catch(e){}
try{ const s = localStorage.getItem(KEY); if(s) state = Object.assign(state, JSON.parse(s)); }catch(e){}

let db=null, uid=null, dbDoc=null, saveChain=Promise.resolve(), saveTimer=null;
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(dbDoc){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      const snapshot = JSON.parse(JSON.stringify(state));
      saveChain = saveChain.then(()=>dbDoc.set(snapshot)).catch(()=>{});
    }, 800);
  }
}
(async()=>{
  try{
    if(!(window.claude && window.claude.use)) return;
    claude.use('assets').then(a=>{ assetsNs=a; }).catch(()=>{});
    const [d,u] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!d || !u) return;
    uid = await u.id(); if(!uid) return;
    db = d; dbDoc = db.doc('data/users/'+uid+'/progress');
    const snap = await dbDoc.get();
    if(snap.exists){ const d=snap.data(); d.images=Object.assign({}, state.images||{}, d.images||{}); state = Object.assign(state, d); try{localStorage.setItem(KEY, JSON.stringify(state));}catch(e){} render(); }
    else { saveChain = saveChain.then(()=>dbDoc.set(JSON.parse(JSON.stringify(state)))).catch(()=>{}); }
  }catch(e){}
})();

/* ===================== Lieu (maison / salle) ===================== */
let curDay=null;
function gymOn(){ const d=curDay; if(!d) return state.place==='gym'; const o=(state.placeByDay||{})[d.id]; if(o) return o==='gym'; return d.placeDefault==='gym'; }
function bx(b){ return (gymOn() && b.g) ? b.g : b; }
function placeChips(){ return `<div class="chips" style="padding-top:2px"><button class="chip" aria-pressed="${!gymOn()}" data-place="home">Home · 12 kg KB</button><button class="chip" aria-pressed="${gymOn()}" data-place="gym">Gym</button>${expressChip()}</div>`; }
function loadField(k){ state.loads=state.loads||{}; const v=state.loads[k]; return `<label class="loadf"><span>Load</span><input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${v!=null?v:''}" data-load="${k}"></label>`; }
function bindPlace(root){
  root.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{ state.placeByDay=state.placeByDay||{}; if(curDay) state.placeByDay[curDay.id]=b.dataset.place; state.place=b.dataset.place; persist(); if(guided.active) stopGuided(); rerender(); });
  root.querySelectorAll('[data-express]').forEach(b=>b.onclick=()=>{ state.express=!state.express; persist(); if(guided.active) stopGuided(); stopBig(); rerender(); });
  root.querySelectorAll('[data-load]').forEach(i=>i.onchange=e=>{ state.loads=state.loads||{}; const v=parseFloat(e.target.value); if(isNaN(v)) delete state.loads[i.dataset.load]; else state.loads[i.dataset.load]=v; persist(); });
}

/* ===================== Durée & mode express ===================== */
function expressOn(){ return !!state.express; }
function restFor(day,ph){ const base = day.rest ? (ph===2?Math.max(45,day.rest-30):day.rest) : 45; return expressOn()? Math.min(base,45) : base; }
function setsFor(b,ph,w,day){ let n=setsOf(rxFor(b.p[ph])); if((w===4||w===8) && day.kind==='sets') n=Math.max(1,n-1); if(expressOn()) n=Math.min(n,3); return n; }
function rxShow(b,ph,w,day){ const n=setsFor(b,ph,w,day); return rxFor(b.p[ph]).replace(/^\d+(\s*×)/, (m,x)=>n+x); }
function warmMin(){ return expressOn()?3:5; }
function blocksMin(day,ph,w,list){ const r=restFor(day,ph); return list.reduce((t,x)=>{ const b=bx(x.b0); return t + setsFor(b,ph,w,day)*(45+r)/60; },0); }
function activeBlocks(day,ph,w){
  const all=day.blocks.map((b0,i)=>({b0,i})); if(!expressOn()) return all;
  const fixed = day.kind==='recovery' ? 10 : warmMin();
  const sel=[]; for(const x of all){ sel.push(x); if(sel.length>(day.kind==='recovery'?2:3) && fixed+blocksMin(day,ph,w,sel)>20){ sel.pop(); break; } } return sel;
}
function estimateMin(day,ph,w){
  if(day.kind==='rest') return 0;
  if(day.kind==='amrap') return warmMin() + (expressOn()?Math.min(day.minutes[ph],15):day.minutes[ph]);
  if(day.kind==='rounds') return warmMin() + (expressOn()?Math.min(day.cap[ph],17):day.cap[ph]);
  const run = day.kind==='recovery' ? (expressOn()?10:day.runMin[ph]) : warmMin();
  return Math.round(run + blocksMin(day,ph,w,activeBlocks(day,ph,w)));
}
function expressChip(){ return `<button class="chip" aria-pressed="${expressOn()}" data-express="1">⏱ Express 20 min</button>`; }

/* ===================== Dates ===================== */
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentWeek(){
  if(!state.start) return 1;
  const s = new Date(state.start+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0);
  const w = Math.floor((t-s)/(7*86400000))+1;
  return Math.min(12, Math.max(0, w));
}
function programDone(){ if(!state.start) return false; const s=new Date(state.start+'T00:00:00'); const t=new Date(); return (t-s)/(7*86400000) >= 12; }
function cycleN(){ return state.cycle||1; }
function phaseOf(w){ const c=cycleN(); if(w<1) w=1; if(c===1) return w<=4?0 : w<=8?1 : 2; if(c===2) return w<=6?1:2; return 2; }
function rxFor(p){ const c=cycleN(); if(c<2) return p; const add=Math.min(c-1,2); return p.replace(/^(\d+)(\s*×)/, (m,n,x)=>Math.min(6,+n+add)+x); }
function todayIdx(){ return (new Date().getDay()+6)%7; }

let view = {tab:'today', week:null, day:null};
function sessionKey(w,id){ return (cycleN()>1?'c'+cycleN()+'-':'')+'w'+w+'-'+id; }
function isDone(w,id){ return state.sessions.some(s=>s.key===sessionKey(w,id)); }

/* ===================== Rendu ===================== */
const app = document.getElementById('app');
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===view.tab?'page':'false'));
  if(view.tab==='today') renderToday();
  else if(view.tab==='program') renderProgram();
  else if(view.tab==='progress') renderProgress();
  else renderFood();
  if(render.keep){ window.scrollTo(0,render.keep); render.keep=null; } else window.scrollTo(0,0);
}
function rerender(){ render.keep=window.scrollY; render(); }

function header(){
  const w = currentWeek(), ph = phaseOf(w);
  return `<div class="mark"><span class="kg">Strong Mom</span><span class="app">Personal program</span></div>
  <div class="meta">${state.start ? `${cycleN()>1?'Cycle '+cycleN()+' · ':''}${w===0?'Week 0 · warm-up week, the program starts Monday':`Week ${w} of 12 · phase ${ph+1}, ${PHASES[ph].name}`}${(w===4||w===8)?' · lighter week':''}${w===12?' · test week':''}` : 'Program not started'}</div>`;
}

function renderToday(){
  const w = view.week ?? currentWeek();
  const dIdx = view.day ?? todayIdx();
  const day = DAYS[dIdx]; const ph = phaseOf(w); curDay=day;
  let html = header();
  if(!state.start){
    html += `<div class="card"><h3>Ready to start?</h3><p class="note">The program starts on the Monday of the current week. Four sessions of 25 to 40 minutes, at home or at the gym, with a progression built for you. Before the first session, do the starting tests in the Progress tab (weight is optional: strength and firmness show up long before the scale does).</p><button class="btn" id="startBtn">Start the program</button></div>`;
  } else if(programDone()){
    html += `<div class="card"><h3>12 weeks done</h3><p class="note">Redo the tests, compare with week 0, then start cycle ${cycleN()+1}. It begins straight in phase 2, with one extra set per exercise at home; at the gym, your logged loads keep climbing. Three cycles = 9 months: that's where the physique really changes.</p><button class="btn" id="restartBtn">Start cycle ${cycleN()+1}</button></div>`;
  }
  html += placeChips();
  html += `<div class="chips" role="tablist">`+DAYS.map((d,i)=>`<button class="chip ${isDone(w,d.id)?'done':''}" role="tab" aria-pressed="${i===dIdx}" data-day="${i}">${d.name.slice(0,3)}</button>`).join('')+`</div>`;
  html += `<h2 class="display session-title">${esc(day.title)}</h2><p class="meta">${esc(day.name)} · week ${w} · ${esc(PHASES[ph].name)}${day.kind!=='rest'?` · <span class="pill">≈ ${estimateMin(day,ph,w)} min</span>`:''}${day.opt?' · <span class="pill warn">optional</span>':''}${isDone(w,day.id)?' · <span class="pill ok">done</span>':''}</p><p>${esc(day.intro)}</p>${expressOn()&&day.kind!=='rest'?`<p class="note">Express mode: the essentials in 20 minutes. Priority exercises, 3 sets max, 45 s rest, 3 min warm-up. A short session done beats a long one skipped.</p>`:''}`;

  if(day.kind!=='rest'){
    html += `<details class="card"><summary>Warm-up (${warmMin()} min)</summary><ol class="plain">${(expressOn()?WARMUP.slice(0,4):WARMUP).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details>`;
  }
  if(day.id==='mer' || day.kind==='rounds'){
    html += `<div class="warnbox"><b>Simple rule:</b> muscle burn is normal, sharp joint pain is not. If that happens, stop the exercise, swap it for another one on the list, and talk to a professional if it persists.</div>`;
  }

  const checks = state.checks[sessionKey(w,day.id)] || [];
  if(day.kind==='sets' || day.kind==='recovery'){
    if(day.kind==='recovery'){
      html += `<div class="card"><h3>Walk / easy cardio</h3><p>${esc(expressOn()?day.runExpress:day.run[ph])}</p><p class="note">A pace where you can talk but not sing. Incline treadmill at 8–12 % brisk walking is excellent for the glutes.${gymOn()?' At the gym: 20 to 25 min of bike, rower or incline treadmill, then the short circuit below.':''}</p><div class="row"><button class="btn small ghost" data-rest="180">3 min timer</button><button class="btn small ghost" data-rest="120">2 min timer</button><button class="btn small ghost" data-rest="60">1 min timer</button></div></div>`;
    }
    const deload = (w===4||w===8);
    if(deload && day.kind==='sets') html += `<p class="pill warn">Lighter week: one set fewer per exercise</p>`;
    if(gymOn() && day.kind==='sets') html += `<p class="note">Gym: pick a load that leaves 2 reps in the tank on the last set. All reps completed two sessions in a row → +2.5 kg (upper body) or +5 kg (lower body). Log your load under each exercise.</p>`;
    if(guided.active && guided.week===w && guided.day===dIdx){ html += renderGuided(day, ph); }

  }
  if(day.kind==='rounds'){
    const r0 = (gymOn() && day.groundsG) ? day.groundsG[ph] : day.rounds[ph]; const r = expressOn()? Object.assign({}, r0, {r:Math.min(r0.r,3)}) : r0; const capShow = expressOn()?Math.min(day.cap[ph],17):day.cap[ph];
    html += `<div class="card"><h3>${r.r} rounds · ${capShow} min cap</h3><p class="note">The cap is a limit, not a target: at the beep, stop where you are and note your rounds. Better 18 clean minutes than 24 dragging ones.</p><ol class="plain">${r.list.map((x,i)=>itemHtml(x, r.k[i])).join('')}</ol><hr>
    <div class="timer" id="bigTimer">0:00</div>

    <hr><div class="row" style="justify-content:space-between"><div><div class="note">Rounds done</div><div class="roundsbig" id="roundsNum">0</div></div><div class="row"><button class="btn ghost small" id="rMinus" aria-label="Remove a round counted by mistake">−1 round</button><button class="btn small" id="rPlus">+1 round</button></div></div></div>`;
  }
  if(day.kind==='rest'){
    html += `<div class="card"><ul class="plain">${day.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  }
  if(day.kind!=='rest' && state.start && !isDone(w,day.id)){
    html += `<div class="card"><h3>Finish the session</h3><div class="stack">
      <label class="field"><span>How hard did it feel? (1 easy – 10 all-out)</span><input type="range" min="1" max="10" value="7" id="rpe" style="padding:0"></label>
      <label class="field"><span>Note (load, how it felt, what got in the way…)</span><input type="text" id="snote" placeholder="e.g. hip thrusts felt easy, go heavier"></label>

  const sb=document.getElementById('startBtn'); if(sb) sb.onclick=()=>{ const td=new Date(); const dow=(td.getDay()+6)%7; const m=mondayOf(td); if(dow>=4) m.setDate(m.getDate()+7); state.start=iso(m); view.week=null; persist(); toast('Program started'); render(); };
  const rb=document.getElementById('restartBtn'); if(rb) rb.onclick=()=>{ if(confirm('Start the next cycle? Your history, loads and images are kept.')){ state.cycle=cycleN()+1; state.start=iso(mondayOf(new Date())); state.checks={}; persist(); render(); } };
  app.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{ const k=sessionKey(w,day.id); const arr=state.checks[k]||[]; arr[+b.dataset.check]=!arr[+b.dataset.check]; state.checks[k]=arr; persist(); renderToday(); });
  app.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>startRest(+b.dataset.rest));

  };

  big.day=day; big.ph=ph; bindBig(); bindImages(app); bindGuided(); bindPlace(app);
  const gb=document.getElementById('goBtn'); if(gb) gb.onclick=()=>showPrep(day, ph, w, ()=>startGuided(day, ph, w, dIdx));

/* ===================== Score de séance ===================== */
function repsOf(rx){ const m=/×\s*(\d+)/.exec(rx); return m?+m[1]:1; }
function sessionScore(day, ph, w, rounds, time){
  if(day.kind==='amrap') return rounds||0;
  if(day.kind==='rounds') return time? Math.round(-time/60*10)/10 : (rounds||0);
  if(day.kind==='sets' || day.kind==='recovery'){ let s=0; activeBlocks(day,ph,w).forEach(({b0})=>{ const b=bx(b0); const n=setsFor(b,ph,w,day), r=repsOf(rxFor(b.p[ph])); const L=(gymOn()&&b0.g&&state.loads&&state.loads[b.k])||1; s+=n*r*L; }); return Math.round(s); }
  return 0;
}
function scoreArrow(wk, id){
  const cur=state.sessions.find(s=>s.key===sessionKey(wk,id)); if(!cur || cur.score==null) return '';
  const prev=state.sessions.find(s=>s.key===sessionKey(wk-1,id)); if(!prev || prev.score==null) return '';
  if(cur.score>prev.score) return '<span class="up">▲</span>'; if(cur.score<prev.score) return '<span class="dn">▼</span>'; return '<span class="eq">=</span>';
}

/* ===================== Objectif avant séance ===================== */
let prepCb=null;

  prepCb=cb; document.getElementById('prep').classList.add('show');
}
document.getElementById('prepGo').onclick=()=>{ document.getElementById('prep').classList.remove('show'); const cb=prepCb; prepCb=null; if(cb) cb(); };
document.getElementById('prepCancel').onclick=()=>{ document.getElementById('prep').classList.remove('show'); prepCb=null; };

/* ===================== Mode guidé ===================== */
let guided = {active:false, week:null, day:null, seq:[], pos:0, restLeft:0, int:null, wake:null};
function setsOf(rx){ const m=/^(\d+)\s*×/.exec(rx); return m?+m[1]:1; }
function buildSeq(day, ph, w){
  const seq=[]; const restSecs=restFor(day,ph);
  activeBlocks(day,ph,w).forEach(({b0,i})=>{ const b=bx(b0); const n=setsFor(b,ph,w,day); for(let s=1;s<=n;s++){ seq.push({t:'work',i,s,n}); seq.push({t:'rest',i,s,n,secs:restSecs}); } });
  seq.pop(); return seq;
}
function startGuided(day, ph, w, dIdx){
  guided={active:true, week:w, day:dIdx, seq:buildSeq(day,ph,w), pos:0, restLeft:0, int:null, wake:null};
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l=>guided.wake=l).catch(()=>{}); }catch(e){}
  renderToday();
}
function stopGuided(){ clearInterval(guided.int); if(guided.wake){ try{guided.wake.release();}catch(e){} } guided.active=false; }
function guidedNext(){
  clearInterval(guided.int);
  const day=DAYS[guided.day]; const cur=guided.seq[guided.pos];
  if(cur && cur.t==='work' && cur.s===cur.n){ const k=sessionKey(guided.week,day.id); const arr=state.checks[k]||[]; arr[cur.i]=true; state.checks[k]=arr; persist(); }
  guided.pos++;
  if(guided.pos>=guided.seq.length){ stopGuided(); beep(3); toast('Session complete, save it'); renderToday(); return; }
  const st=guided.seq[guided.pos];
  if(st.t==='rest'){ guided.restLeft=st.secs; guided.int=setInterval(()=>{ guided.restLeft--; const el=document.getElementById('gCount'); if(el) el.textContent=fmt(guided.restLeft); if(guided.restLeft<=0){ beep(2); guidedNext(); } },1000); }
  renderToday();
}
function guidedSkipExercise(){ clearInterval(guided.int); const cur=guided.seq[guided.pos]; let p=guided.pos; while(p<guided.seq.length && guided.seq[p].i===cur.i) p++; guided.pos=p-1; guidedNext(); }
function renderGuided(day, ph){
  const w=guided.week; const st=guided.seq[guided.pos]; const b0=day.blocks[st.i]; const b=bx(b0); const pct=Math.round(100*guided.pos/guided.seq.length);
  const thumb=k=>{ if(vidSrc(k)) return vidTag(k,'gvid'); const s=imgSrc(k); return s?`<img class="thumb" src="${s}" alt="${esc(LIBMAP[k]||'')}" data-view="${k}">`:''; };
  let html=`<div class="progressline"><i style="width:${pct}%"></i></div>`;
  if(st.t==='work'){
    html+=`<div class="guided"><div class="lbl">Set</div><div class="count">${st.s}/${st.n}</div><div class="exname">${esc(b.n)}</div><div class="rx">${esc(rxShow(b,ph,w,day))}</div><div class="cue">${esc(b.cue)}</div>${(gymOn()&&b0.g)?loadField(b.k):''}${b.k?thumb(b.k):''}
    <div class="btns"><button class="btn" id="gNext">Set done${guided.pos===guided.seq.length-1?' · finish':''}</button><div class="row" style="justify-content:center"><button class="btn ghost small" id="gSkip">Skip exercise</button><button class="btn ghost small" id="gQuit">Quit</button></div></div></div>`;
  } else {
    const nxt=guided.seq.slice(guided.pos+1).find(x=>x.t==='work' && x.i!==st.i); const nb0=nxt?day.blocks[nxt.i]:null; const nb=nb0?bx(nb0):null; const last=(st.s===st.n);
    html+=`<div class="guided rest"><div class="lbl">Rest</div><div class="count" id="gCount">${fmt(guided.restLeft)}</div>`;
    if(last && nb){ html+=`<div class="next"><div class="lbl">Next exercise</div><div class="exname">${esc(nb.n)}</div><div class="rx">${esc(rxShow(nb,ph,w,day))}</div><div class="cue" style="margin:6px 0 0;max-width:none">${esc(nb.cue)}</div>${nb.k?thumb(nb.k):''}</div>`; }
    else { html+=`<div class="lbl" style="margin-top:8px">Next: set ${st.s+1}/${st.n} · ${esc(b.n)}</div>`; }
    html+=`<div class="btns"><button class="btn" id="gNext">Skip rest</button><div class="row" style="justify-content:center"><button class="btn ghost small" id="gPlus">+30 s</button><button class="btn ghost small" id="gQuit">Quit</button></div></div></div>`;
  }
  return html;
}
function bindGuided(){
  const n=document.getElementById('gNext'); if(n) n.onclick=guidedNext;
  const s=document.getElementById('gSkip'); if(s) s.onclick=guidedSkipExercise;
  const q=document.getElementById('gQuit'); if(q) q.onclick=()=>{ if(confirm('Quit guided mode? Completed exercises stay checked.')){ stopGuided(); renderToday(); } };
  const pl=document.getElementById('gPlus'); if(pl) pl.onclick=()=>{ guided.restLeft+=30; const el=document.getElementById('gCount'); if(el) el.textContent=fmt(guided.restLeft); };
}

/* ===================== Gros chrono (AMRAP / metcon) ===================== */
let big = {int:null, remaining:0, elapsed:0, countdown:true, rounds:0, running:false, started:false, secs:0, day:null, ph:0, wake:null};
function fmt(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
const focusEl=document.getElementById('focus');
function bindBig(){
  const st=document.getElementById('tStart'); if(!st) return;
  const secs=+st.dataset.secs; big.countdown = secs>0; big.secs=secs;
  if(!big.started){ big.remaining=secs; big.elapsed=0; }
  drawBig();
  st.onclick=()=>{ if(big.started){ openFocus(); tick(); } else showPrep(big.day, big.ph, currentWeek(), ()=>{ openFocus(); tick(); }); };
  document.getElementById('tPause').onclick=pauseBig;
  document.getElementById('tReset').onclick=resetBig;
  document.getElementById('rPlus').onclick=()=>{ big.rounds++; drawBig(); };
  document.getElementById('rMinus').onclick=()=>{ big.rounds=Math.max(0,big.rounds-1); drawBig(); };
}
function tick(){ if(big.running) return; big.running=true; big.started=true; big.int=setInterval(()=>{ if(big.countdown){ big.remaining--; if(big.remaining<=0){ clearInterval(big.int); big.running=false; big.remaining=0; beep(3); } } else big.elapsed++; drawBig(); },1000); drawBig(); }
function pauseBig(){ clearInterval(big.int); big.running=false; drawBig(); }
function resetBig(){ clearInterval(big.int); big.running=false; big.started=false; big.remaining=big.secs; big.elapsed=0; big.rounds=0; drawBig(); }
function drawBig(){ const v=big.countdown? fmt(big.remaining) : fmt(big.elapsed); const capS = (!big.countdown && big.day && big.day.cap) ? (expressOn()?Math.min(big.day.cap[big.ph],17):big.day.cap[big.ph])*60 : 0; const over = capS>0 && big.elapsed>=capS; if(over && !big.overBeeped){ big.overBeeped=true; beep(3); } if(!over) big.overBeeped=false;
  const t=document.getElementById('bigTimer'); if(t){ t.textContent=v; t.classList.toggle('over',over); } const r=document.getElementById('roundsNum'); if(r) r.textContent=big.rounds;
  const ft=document.getElementById('fTimer'); ft.textContent=v; ft.classList.toggle('paused', big.started && !big.running); ft.classList.toggle('over',over); document.getElementById('fRounds').textContent=big.rounds;
  document.getElementById('fPause').textContent = big.running?'Pause':(big.started?'Resume':'Start'); }
function openFocus(){
  const day=big.day, ph=big.ph; if(!day) return;
  let rr = (day.kind==='rounds' && gymOn() && day.groundsG) ? day.groundsG[ph] : (day.kind==='rounds'? day.rounds[ph] : null); if(rr && expressOn()) rr=Object.assign({}, rr, {r:Math.min(rr.r,3)});
  const items = day.kind==='amrap' ? day.rounds[ph].map((x,i)=>itemHtml(x, day.rk[ph][i])) : rr.list.map((x,i)=>itemHtml(x, rr.k[i]));
  document.getElementById('fTitle').textContent = day.kind==='amrap' ? `AMRAP ${expressOn()?Math.min(day.minutes[ph],15):day.minutes[ph]} min · as many rounds as possible` : `${rr.r} rounds for time · ${expressOn()?Math.min(day.cap[ph],17):day.cap[ph]} min cap`;
  document.getElementById('fList').innerHTML = items.join('');
  bindImages(focusEl); focusEl.classList.add('show'); focusEl.scrollTop=0;
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l=>big.wake=l).catch(()=>{}); }catch(e){}
}
function closeFocus(){ focusEl.classList.remove('show'); if(big.wake){ try{big.wake.release();}catch(e){} big.wake=null; } }
document.getElementById('fPause').onclick=()=>{ if(big.running) pauseBig(); else tick(); };
document.getElementById('fPlus').onclick=()=>{ big.rounds++; drawBig(); };
document.getElementById('fMinus').onclick=()=>{ big.rounds=Math.max(0,big.rounds-1); drawBig(); };
document.getElementById('fQuit').onclick=()=>{ pauseBig(); closeFocus(); renderToday(); toast(big.rounds+' rounds · '+(big.countdown?fmt(big.secs-big.remaining):fmt(big.elapsed))); };
function stopBig(){ clearInterval(big.int); big.running=false; big.started=false; big.rounds=0; closeFocus(); }

/* ===================== Rest ===================== */
let rest = {int:null, left:0};
const restbar=document.getElementById('restbar'), restnum=document.getElementById('restnum');
function startRest(s){ clearInterval(rest.int); rest.left=s; restbar.classList.add('show'); restnum.textContent=fmt(rest.left);
  rest.int=setInterval(()=>{ rest.left--; restnum.textContent=fmt(rest.left); if(rest.left<=0){ clearInterval(rest.int); beep(2); setTimeout(()=>restbar.classList.remove('show'),1200); } },1000); }
document.getElementById('restplus').onclick=()=>{ rest.left+=30; restnum.textContent=fmt(rest.left); };
document.getElementById('reststop').onclick=()=>{ clearInterval(rest.int); restbar.classList.remove('show'); };
let actx=null;
function beep(n){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); const t=actx.currentTime+i*0.25; g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.start(t); o.stop(t+0.2); } }catch(e){} }

/* ===================== Images d'exercices ===================== */
function imgSrc(k){ if(state.images && state.images[k]) return '/_blob/'+state.images[k]; if(localImgs[k]) return localImgs[k]; if(repoImgs[k]) return 'images/'+repoImgs[k]; return null; }
const YT = {goblet:'kettlebell goblet squat', hipthrustkb:'floor hip thrust kettlebell', fente:'kettlebell goblet reverse lunge', abduction:'side lying hip abduction', pont1:'single leg glute bridge', planche:'plank', pompesg:'knee push up incline push up progression', row2:'kettlebell bent over row two hands', press2:'kettlebell two hand press', row1:'kettlebell gorilla row', halo:'kettlebell halo', deadbug:'dead bug exercise', birddog:'bird dog exercise', rdlkb:'kettlebell romanian deadlift', swing2:'kettlebell swing two hand', pontsur:'feet elevated glute bridge', stepup:'step up exercise glutes', kickback:'quadruped glute kickback', suitcase:'kettlebell suitcase carry', sldl:'single leg deadlift', burpee:'no jump burpee', mollets:'standing calf raise', mobilite:'90 90 hip stretch pigeon couch stretch', legpress:'leg press high foot placement glutes', hipthrustbar:'barbell hip thrust', walkinglunge:'dumbbell walking lunge', abdmachine:'hip abduction machine', hipthrust1g:'single leg hip thrust bench', dbbench:'dumbbell bench press', cablerow:'seated cable row', dbohp:'dumbbell shoulder press', latpull:'lat pulldown', rdl:'barbell romanian deadlift', kbswing16:'kettlebell swing', goodmorning:'45 degree back extension glutes', stepupdb:'dumbbell step up', cablekick:'cable glute kickback', farmerdb:'dumbbell farmers walk', rower:'rowing machine', bulgare:'bulgarian split squat glutes', legcurl:'lying leg curl'};
function vidSrc(k){ if(state.videos && state.videos[k]) return '/_blob/'+state.videos[k]; if(repoVids[k]) return 'videos/'+repoVids[k]; return null; }
function vidTag(k, cls){ const s=vidSrc(k); return s?`<video class="${cls||'gvid'}" src="${s}" autoplay loop muted playsinline preload="auto"></video>`:''; }
async function saveVideo(k,file,labelEl){

async function deleteVideo(k){ state.videos=state.videos||{}; const id=state.videos[k]; if(!id) return; delete state.videos[k]; persist(); if(assetsNs){ try{ await assetsNs.delete(id); }catch(e){} } rerender(); }
function ytLink(k){ return 'https://www.youtube.com/results?search_query='+encodeURIComponent('how to '+(YT[k]||LIBMAP[k]||k)+' proper form technique tutorial'); }
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const m=Math.min(1,700/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*m); c.height=Math.round(img.height*m); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res(b):rej(new Error('no blob')),'image/jpeg',0.82); }; img.onerror=rej; img.src=u; }); }
async function saveImage(k,file,labelEl){

}
async function deleteImage(k){
  state.images = state.images || {};
  if(state.images[k]){ const id=state.images[k]; delete state.images[k]; persist(); if(assetsNs){ try{ await assetsNs.delete(id); }catch(e){} } }
  if(localImgs[k]){ delete localImgs[k]; try{ localStorage.setItem('solide-imgs', JSON.stringify(localImgs)); }catch(e){} }
  rerender();
}
function imgTools(k){
  const src=imgSrc(k);
  return `${src?`<img class="thumb" src="${src}" alt="${esc(LIBMAP[k]||k)}" data-view="${k}">`:''}<div class="tools"><a class="link" href="${ytLink(k)}" target="_blank" rel="noopener">Video demo</a><label class="upl">${src?'Change image':'Add image'}<input type="file" accept="image/*" data-img="${k}"></label>${vidSrc(k)?`<button class="upl" data-playvid="${k}">▶ My video</button>`:''}<label class="upl">${vidSrc(k)?'Change video':'Add video'}<input type="file" accept="video/mp4,video/webm,video/quicktime" data-vid="${k}"></label></div>`;
}
let ovKey=null;
function bindImages(root){
  root.querySelectorAll('[data-img]').forEach(i=>i.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f){ saveImage(i.dataset.img, f, i.parentElement); } e.target.value=''; });
  root.querySelectorAll('[data-vid]').forEach(i=>i.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) saveVideo(i.dataset.vid, f, i.parentElement); e.target.value=''; });
  root.querySelectorAll('[data-playvid]').forEach(b=>b.onclick=()=>{ ovKey=b.dataset.playvid; const img=document.getElementById('ovImg'); img.style.display='none'; const v=document.getElementById('ovVid'); v.src=vidSrc(ovKey); v.style.display='block'; v.play().catch(()=>{}); document.getElementById('ovCap').textContent=LIBMAP[ovKey]||ovKey; document.getElementById('ovDel').textContent='Delete video'; document.getElementById('overlay').classList.add('show'); });
  root.querySelectorAll('[data-view]').forEach(i=>i.onclick=()=>{ ovKey=i.dataset.view; const v=document.getElementById('ovVid'); v.pause(); v.style.display='none'; const img=document.getElementById('ovImg'); img.style.display='block'; img.src=imgSrc(ovKey); document.getElementById('ovDel').textContent='Delete image'; document.getElementById('ovCap').textContent=LIBMAP[ovKey]||ovKey; document.getElementById('overlay').classList.add('show'); });
}
document.getElementById('ovClose').onclick=()=>{ document.getElementById('overlay').classList.remove('show'); document.getElementById('ovVid').pause(); };
document.getElementById('ovDel').onclick=()=>{ const vmode=document.getElementById('ovVid').style.display==='block'; if(ovKey && confirm(vmode?'Delete this video?':'Delete this image?')){ document.getElementById('overlay').classList.remove('show'); document.getElementById('ovVid').pause(); if(vmode) deleteVideo(ovKey); else deleteImage(ovKey); } };
document.getElementById('overlay').onclick=e=>{ if(e.target.id==='overlay'){ e.target.classList.remove('show'); document.getElementById('ovVid').pause(); } };
function renderLibrary(){
  return `<div class="card"><h3>Exercise cards</h3><p class="note">For each exercise: a video for technique, and your own image (Image Playground, screenshot, photo) to remember it at a glance. Images then show up inside the sessions. On the GitHub version, images placed in the repo's images/ folder load automatically on every phone. Same for videos (10 to 15 s, looping) in the videos/ folder: they play during the exercise in guided mode.</p></div>
  <div class="lib">${LIB.map(([k,n])=>{ const s=imgSrc(k); return `<div class="item">${s?`<img src="${s}" alt="${esc(n)}" data-view="${k}">`:`<div class="ph">No image yet</div>`}<b>${esc(n)}</b><div class="tools"><a class="link" href="${ytLink(k)}" target="_blank" rel="noopener">Video</a><label class="upl">${s?'Change':'Add'}<input type="file" accept="image/*" data-img="${k}"></label>${vidSrc(k)?`<button class="upl" data-playvid="${k}">▶</button>`:''}<label class="upl">🎬<input type="file" accept="video/mp4,video/webm,video/quicktime" data-vid="${k}"></label></div></div>`; }).join('')}</div>`;
}

/* ===================== Programme ===================== */
function renderProgram(){
  const w=currentWeek(), ph=phaseOf(w);
  let html = header();
  html += `<h2 class="display session-title">The plan</h2>
  <p>Built around your week: Monday, Wednesday and Thursday are daycare days with the gym next door. Those three sessions carry the whole program, each one works the glutes, and together they're all you need for the result you want. Tuesday, Friday and Saturday are bonuses: a stroller walk or jog, a home circuit, cardio you enjoy. Doing them helps a little; skipping them costs nothing. Every session comes in a <b>Gym</b> version (the default on daycare days) and a <b>Home</b> version with the 12 kg kettlebell, switchable at the top of the Today tab.</p>
  <div class="phaseline">${Array.from({length:12},(_,i)=>`<i class="p${phaseOf(i+1)} ${state.start&&i+1===w?'cur':''}"></i>`).join('')}</div>`;
  PHASES.forEach((p,i)=>{ html += `<div class="card"><h3>Phase ${i+1} · ${esc(p.name)} <span class="pill">${esc(p.weeks)}</span></h3><p>${esc(p.goal)}</p></div>`; });
  html += `<div class="card"><h3>How long it takes</h3><p>Every session shows its estimated length next to the title (warm-up included). Busy day? Tap "Express 20 min" at the top of the session: the app keeps the priority exercises, caps sets at 3 and shortens the rests. The program is built to last for months, not to be perfect every day.</p></div>`;
  html += `<div class="card"><h3>The week</h3><div class="tablewrap"><table><tr><th>Day</th><th>Session</th><th>Length</th></tr>
  <tr><td>Monday</td><td><b>Gym</b> · Glutes & legs</td><td>40 min</td></tr>
  <tr><td>Tuesday</td><td>Bonus · stroller walk/run & core</td><td>35 min</td></tr>
  <tr><td>Wednesday</td><td><b>Gym</b> · Upper body, core & glutes</td><td>40 min</td></tr>
  <tr><td>Thursday</td><td><b>Gym</b> · Glutes & hamstrings</td><td>40 min</td></tr>
  <tr><td>Friday</td><td>Bonus · full-body circuit at home</td><td>25 min</td></tr>
  <tr><td>Saturday</td><td>Bonus · cardio you enjoy</td><td>45 min</td></tr>
  <tr><td>Sunday</td><td>Rest</td><td>–</td></tr></table></div>
  <p class="note">The three gym days are the priority. A week with just Monday, Wednesday and Thursday is a complete week.</p></div>`;
  html += `<div class="card"><h3>Why this works for firming up</h3><ul class="plain">
  <li>"Toning" is muscle being built under the skin. It needs loads that get hard on the last reps, not endless sets with nothing in your hands.</li>
  <li>Hip thrusts, Romanian deadlifts, lunges and squats are the four most effective glute exercises. They come back every week on purpose.</li>
  <li>Upper body and core give a balanced silhouette and a posture that shows everything off.</li>
  <li>Without enough protein and sleep, sessions build very little. See Nutrition.</li></ul></div>`;
  html += `<div class="card"><h3>Progression rules</h3><ul class="plain">
  <li>Finish every set with 1 or 2 reps in the tank for 2 sessions in a row → move to the next phase's prescription for that exercise, even early.</li>
  <li>Gym: a load that leaves 2 reps in the tank on the last set. All reps completed two sessions in a row → +2.5 kg (upper body, hip thrust +5 kg). Log the load under the exercise; the app reminds you next time.</li>
  <li>Gym, week 1: learn the hip thrust and Romanian deadlift with the empty bar. Load comes fast, technique doesn't.</li>
  <li>After 12 weeks: start the next cycle. It restarts in phase 2, adds a set per exercise at home, and at the gym progress simply continues through the load. Plan on 3 cycles (9 months) for a full physique change.</li>
  <li>A rep breaks down (rounded back, knee caving in) → stop the set.</li>
  <li>Weeks 4 and 8: lighter. One set fewer per exercise.</li>
  <li>Every 4 weeks: redo the tests in Progress. Side and back photos in the same conditions are the best judge, well ahead of the scale.</li></ul></div>`;
  html += `<h2 class="display session-title" style="font-size:34px">Cards</h2>` + renderLibrary();
  app.innerHTML = html; bindImages(app);
}

/* ===================== Progrès ===================== */
function renderProgress(){
  const w=currentWeek();
  const total = state.sessions.length;
  const thisWeek = state.sessions.filter(s=>s.week===w).length; const NDAYS=DAYS.filter(d=>d.kind!=='rest' && !d.opt).length; const coreWeek=state.sessions.filter(s=>s.week===w && !(DAYS.find(d=>d.id===s.day)||{}).opt).length;
  const weeksActive = new Set(state.sessions.map(s=>s.week)).size;
  let html = header();
  html += `<h2 class="display session-title">Progress</h2>
  <div class="kpi"><div><b>${total}</b><span>sessions done</span></div><div><b>${state.start?coreWeek+'/'+NDAYS:'–'}</b><span>key sessions this week (Mon · Wed · Thu)</span></div><div><b>${weeksActive}</b><span>active weeks</span></div></div>`;
  html += `<div class="card"><h3>The 12 weeks</h3><p class="note">In each square: ▲ better than the previous week, ▼ lower, = same. Gym: total tonnage (sets × reps × load). Home: rep volume. Circuits: rounds or time.</p><div class="grid12"><span></span>${['M','T','W','T','F','S'].map(d=>`<span class="hd">${d}</span>`).join('')}`;
  for(let wk=1;wk<=12;wk++){ html += `<span class="wk">W${wk}</span>`; DAYS.slice(0,6).forEach(d=>{ html += `<span class="cell ${isDone(wk,d.id)?'on':''} ${d.opt?'opt':''} ${state.start&&wk===w?'cur':''}">${scoreArrow(wk,d.id)}</span>`; }); }
  html += `</div></div>`;

  const last = state.tests[state.tests.length-1];
  html += `<div class="card"><h3>Tests</h3><p class="note">Do them before you start (week 0), then on the Sunday of weeks 4, 8 and 12. Warm up, rest 3 min between tests.</p>
  <div class="stack">
  <div class="two"><label class="field"><span>Week</span><input type="number" id="tWeek" min="0" max="12" value="${state.start?(last&&last.week===w?w:Math.max(0,w-(w%4===0?0:w%4))) :0}"></label><label class="field"><span>Weight (kg)</span><input type="number" id="t_weight" step="0.1" value="${state.weight}"></label></div>
  <div class="two"><label class="field"><span>Max push-ups</span><input type="number" id="t_pushups" placeholder="40"></label><label class="field"><span>Hip thrusts in 1 min</span><input type="number" id="t_swings" placeholder="e.g. 40"></label></div>
  <div class="two"><label class="field"><span>Plank (s)</span><input type="number" id="t_plank"></label><label class="field"><span>Goblet squats in 2 min</span><input type="number" id="t_squats"></label></div>
  <button class="btn" id="saveTest">Save tests</button></div></div>`;
  if(state.tests.length){
    html += `<div class="card"><h3>Trend</h3>`;
    html += chart('Max push-ups','pushups') + chart('Weight (kg)','weight') + chart('Hip thrusts in 1 min','swings');
    html += `<div class="tablewrap"><table><tr><th>Wk</th>${TESTS.map(t=>`<th>${esc(t.label.split(' ')[0])}</th>`).join('')}<th></th></tr>`;
    state.tests.forEach((t,i)=>{ html += `<tr><td>${t.week}</td>${TESTS.map(x=>`<td>${t[x.k]??'–'}</td>`).join('')}<td><button class="btn ghost small" data-del="${i}">✕</button></td></tr>`; });
    html += `</table></div></div>`;
  }
  if(state.sessions.length){
    html += `<div class="card"><h3>Recent sessions</h3><div class="tablewrap"><table><tr><th>Date</th><th>Session</th><th>Effort</th><th>Note</th></tr>`;
    state.sessions.slice(-8).reverse().forEach(s=>{ const d=DAYS.find(x=>x.id===s.day); html += `<tr><td>${esc(s.date)}</td><td>W${s.week} ${esc(d?d.title:s.day)}${s.rounds?` · ${s.rounds} rds`:''}${s.time?` · ${fmt(s.time)}`:''}</td><td>${s.rpe}</td><td>${esc(s.note||'')}</td></tr>`; });
    html += `</table></div></div>`;
  }
  html += `<div class="card"><h3>Data</h3><p class="note">Your sessions and tests are saved for you only.</p><label class="field" style="margin-bottom:10px"><span>Program start Monday</span><input type="date" id="startIn" value="${state.start||''}"></label><button class="btn ghost small" id="resetAll">Erase everything</button></div>`;
  app.innerHTML = html;
  document.getElementById('saveTest').onclick=()=>{
    const t={week:+document.getElementById('tWeek').value, date:iso(new Date())};
    TESTS.forEach(x=>{ const v=document.getElementById('t_'+x.k).value; if(v!=='') t[x.k]=+v; });
    if(t.weight) state.weight=t.weight;
    state.tests.push(t); state.tests.sort((a,b)=>a.week-b.week); persist(); toast('Tests saved'); renderProgress();
  };
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ state.tests.splice(+b.dataset.del,1); persist(); renderProgress(); });
  const si=document.getElementById('startIn'); if(si) si.onchange=e=>{ if(e.target.value){ state.start=iso(mondayOf(new Date(e.target.value+'T00:00:00'))); persist(); render(); } };
  document.getElementById('resetAll').onclick=()=>{ if(confirm('Erase all history and start over?')){ state={start:null, weight:state.weight, checks:{}, sessions:[], tests:[], amrapRounds:{}, images:state.images||{}, place:state.place, loads:state.loads||{}, cycle:1}; persist(); render(); } };
}
function chart(title,key){
  const pts = state.tests.filter(t=>t[key]!=null); if(pts.length<2) return '';
  const W=320,H=110,p=18; const vals=pts.map(t=>t[key]); let mn=Math.min(...vals), mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;}
  const x=i=>p+i*(W-2*p)/(pts.length-1), y=v=>H-p-(v-mn)*(H-2*p)/(mx-mn);
  const line=pts.map((t,i)=>`${x(i)},${y(t[key])}`).join(' ');
  return `<div class="note" style="margin-top:8px">${esc(title)}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t[key])}" r="4" fill="var(--accent)"/><text x="${x(i)}" y="${y(t[key])-9}" font-size="11" text-anchor="middle" fill="var(--ink)">${t[key]}</text><text x="${x(i)}" y="${H-3}" font-size="10" text-anchor="middle" fill="var(--ink-2)">S${t.week}</text>`).join('')}</svg>`;
}

/* ===================== Nutrition ===================== */
function renderFood(){
  const kg = state.weight||62;
  const pMin=Math.round(kg*1.6), pMax=Math.round(kg*2.0);
  const kMin=Math.round(kg*29/50)*50, kMax=Math.round(kg*33/50)*50;
  let html = header();
  html += `<h2 class="display session-title">Eat to get strong</h2>
  <p>To firm up you need to build muscle, and muscle is built with protein and enough energy. Cutting hard backfires: the body loses muscle, and firmness with it. The goal here is simple: eat enough to get stronger, and let the shape follow.</p>
  <div class="card"><label class="field"><span>Current weight (kg), for the calculation</span><input type="number" id="wIn" step="0.1" value="${kg}"></label></div>
  <div class="kpi"><div><b>${pMin}–${pMax} g</b><span>protein per day</span></div><div><b>${kMin}–${kMax}</b><span>kcal per day, estimate</span></div><div><b>3 to 4</b><span>meals with 25–35 g protein</span></div></div>
  <div class="card"><h3>How to adjust</h3><ul class="plain">
  <li>Protein is the one target to hit every day. The rest is an estimate.</li>
  <li>Judge over 4 weeks with photos, clothes and the tests, not day to day on the scale: your cycle alone moves weight by 1 to 2 kg.</li>
  <li>If you also want to lose a little fat: remove 200 to 300 kcal, never more, keeping protein up. Lower than that and the sessions suffer.</li></ul></div>
  <div class="card"><h3>A typical day</h3><ul class="plain">
  <li><b>Breakfast:</b> Greek yogurt or skyr with fruit and oats, or 2 eggs + whole-grain bread (aim for 25 g protein).</li>
  <li><b>Lunch:</b> 120 to 150 g chicken, fish, tofu or legumes + a starch + plenty of vegetables.</li>
  <li><b>Snack:</b> cottage cheese, a handful of almonds, or a shake if the day is short on protein.</li>
  <li><b>Dinner:</b> same logic as lunch.</li>
  <li><b>Sunday:</b> batch-cook. A simple, repeated plan sticks; a perfect one doesn't.</li></ul></div>
  <div class="card"><h3>Supplements, without overdoing it</h3><p class="note">Two useful things, one seasonal, and nothing else is needed.</p><ul class="plain">
  <li><b>Creatine monohydrate</b>: 3 g a day, every day, in a glass of water. As much evidence for women as for men on strength and firmness; +0.5 to 1 kg of water inside the muscle the first weeks is normal and is not fat. In France: Nutripure, Nutri&Co or Decathlon, all with the Creapure label.</li>
  <li><b>Protein powder</b>: only to top up on days you don't reach ${pMin} g. Whey, or a plant blend (pea + rice) if you prefer. One scoop = 20 to 25 g.</li>
  <li><b>Vitamin D</b>: October to March, 1,000 to 2,000 IU a day, or after a blood test with your doctor.</li>
  <li><b>Iron</b>: only if a blood test shows a deficiency, which is common in women who train. Don't take it blindly.</li>
  <li>Fat burners, collagen, BCAAs, "booty boosters": not needed.</li></ul>
  <p class="note">Pregnancy, breastfeeding, medication or kidney issues: check creatine and protein intake with your doctor.</p></div>
  <div class="card"><h3>The rest</h3><ul class="plain"><li>Sleep 7 to 9 h.</li><li>Walk 8,000 steps a day: the glutes work on every uphill step.</li><li>Water 2 to 2.5 L.</li><li>Alcohol as little as possible.</li></ul></div>`;
  app.innerHTML = html;
  document.getElementById('wIn').onchange=e=>{ state.weight=+e.target.value||62; persist(); renderFood(); };
}

/* ===================== Divers ===================== */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; render(); });
render();
</script>
